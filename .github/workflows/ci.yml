name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      # pinned: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pinned: actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q

  validate:
    runs-on: ubuntu-latest
    # The official action pip-installs hermes-agent from git, which its own
    # setup.py build guard refuses (pip/PyPI are unsupported distribution
    # methods upstream). Keep attempting (self-heals if upstream fixes the
    # action) but don't fail the build over it.
    continue-on-error: true
    steps:
      # pinned: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pinned: NousResearch/hermes-agent@main (2026-09-15)
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@69fd61b0efbe2bf7f412714ed8c35e40dfddc534
        with:
          path: .
